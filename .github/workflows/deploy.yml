name: Deploy

# Deploys the dashboard to the VPS on every push to main (or manually from the Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.sha }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SHA,APP_DIR
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            git fetch --prune origin main
            git reset --hard "$SHA"
            bash ./deploy/deploy.sh
