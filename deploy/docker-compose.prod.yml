# Maintenance DASHBOARD (Next.js) on the shared VPS. Caddy (host) does HTTPS -> 127.0.0.1:${WEB_PORT}.
name: maintenance-dashboard

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set NEXT_PUBLIC_SERVER_URL in deploy/.env}
    image: maintenance-dashboard:latest
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-3005}:3000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
